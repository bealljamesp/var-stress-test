[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stress_engine"
version = "0.1.0"
description = "Macroeconomic Crisis Stress Engine & VaR Backtesting Framework"
authors = [{ name = "James Beall", email = "BeallJamesP@gmail.com" }]
requires-python = ">=3.12"

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "arch>=5.6.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyarrow>=14.0.0",
    "yfinance>=0.2.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "venv", "Archive"]
